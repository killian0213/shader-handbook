<!doctype html>
<!-- Dev-only contact sheet: renders every examples/*.glsl matching ?m= in a grid. -->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>examples contact sheet</title>
<style>
  body { margin: 0; background: #111; color: #ccc; font: 13px system-ui; }
  .g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
  figure { margin: 0; }
  canvas { width: 100%; aspect-ratio: 1/1; display: block; background: #000; }
  figcaption { padding: 4px 2px; }
  .e { color: #f66; white-space: pre-wrap; font: 11px monospace; }
</style>
</head>
<body>
<div class="g" id="g"></div>
<script src="../js/md.js"></script>
<script src="../js/glsl-lib.js"></script>
<script src="../js/runtime.js"></script>
<script>
var q = new URLSearchParams(location.search);
var g = document.getElementById('g');

var load;
if (q.get('ch')) {
  // Every full-shader block of one chapter, in document order.
  load = fetch('../manifest.json').then(function (r) { return r.json(); })
    .then(function (m) {
      var ch = m.chapters.filter(function (c) { return c.id.indexOf(q.get('ch')) === 0; })[0];
      return fetch('../../shader-handbook/' + ch.file).then(function (r) { return r.text(); });
    })
    .then(function (md) {
      return MD.render(md, {}).blocks.map(function (b, i) {
        return { name: '#' + i + ' ' + (b.marker || 'plain'), src: b.lang === 'glsl' ? b.code : null };
      }).filter(function (b) {
        return b.src && /void\s+mainImage/.test(b.src);
      });
    });
} else {
  var match = q.get('m') || 'ch6_stage';
  var list = [];
  for (var i = 1; i <= 8; i++) list.push(match + i + '.glsl');
  load = Promise.all(list.map(function (n) {
    return fetch('../../shader-handbook/examples/' + n)
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (t) { return { name: n, src: t }; });
  }));
}

load.then(function (files) {
  files.forEach(function (f) {
    if (!f.src) return;
    var fig = document.createElement('figure');
    var cv = document.createElement('canvas');
    var cap = document.createElement('figcaption');
    cap.textContent = f.name;
    fig.appendChild(cv); fig.appendChild(cap); g.appendChild(fig);
    try {
      var pl = new Runtime.Player(cv);
      var plan = GLSLLib.plan(f.src.replace(/\s+$/, ''), '', null);
      var r = pl.setSource(plan.candidates[0].src);
      if (!r.ok) throw new Error(r.log);
      pl.visible = true;
    } catch (err) {
      var e = document.createElement('div');
      e.className = 'e'; e.textContent = String(err.message || err);
      fig.appendChild(e);
    }
  });
  Runtime.start();
  document.title = 'ready';
});
</script>
</body>
</html>
