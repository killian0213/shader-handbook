<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadertoy 效果实现手册 · 网页版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b9d'/%3E%3Cstop offset='.5' stop-color='%23ffb454'/%3E%3Cstop offset='1' stop-color='%2363b3ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script>
  // Applied before first paint so the page never flashes the wrong theme.
  (function () {
    var q = (location.search.match(/[?&]theme=(\w+)/) || [])[1];
    if (q) localStorage.setItem('shbk-theme', q);
    var t = localStorage.getItem('shbk-theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    var s = localStorage.getItem('shbk-fontsize');
    if (s) document.documentElement.style.setProperty('--base', s);
  })();
</script>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="menuBtn" title="目录">☰</button>
  <a class="brand" href="#/ch/README">
    <span class="brand-mark"></span>
    <span class="brand-text">Shadertoy 效果实现手册</span>
  </a>

  <div class="search-wrap">
    <input id="search" type="search" placeholder="搜索全书（技法、函数名、作品名…）" autocomplete="off">
    <div id="searchResults" class="search-results" hidden></div>
  </div>

  <div class="topbar-actions">
    <button class="icon-btn" id="themeBtn" title="配色：浅色 / 纸黄 / 深色">浅</button>
    <button class="icon-btn" id="fontBtn" title="正文字号">A</button>
    <button class="btn" id="pauseAll" title="暂停/继续页面上所有动画">⏸ 全部暂停</button>
    <a class="btn" href="#/playground">⚡ 沙盒</a>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content" id="content">
    <div class="loading">正在载入…</div>
  </main>
  <aside class="toc" id="toc"></aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <span id="modalTitle"></span>
      <div class="modal-tools">
        <button class="btn" id="modalRun">▶ 运行这个作品</button>
        <button class="icon-btn" id="modalClose">✕</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/md.js"></script>
<script src="js/glsl-lib.js"></script>
<script src="js/runtime.js"></script>
<script src="js/app.js"></script>
</body>
</html>
